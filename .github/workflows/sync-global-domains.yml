name: Sync Bitwarden global domains

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      bitwarden_ref:
        description: "bitwarden/server ref to sync"
        required: false
        default: "main"
        type: string

# fork 仓库里 GITHUB_TOKEN 无法创建 PR（repo 设置限制），
# 因此改为直接 push 到 main —— 本仓库 main 无分支保护，contents: write 已实测可用。
permissions:
  contents: write

jobs:
  sync-global-domains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22

      - name: Sync generated Bitwarden domains
        env:
          BITWARDEN_REF: ${{ inputs.bitwarden_ref || 'main' }}
        run: |
          case "$BITWARDEN_REF" in
            "" | *[!A-Za-z0-9._/-]* )
              echo "Invalid bitwarden_ref"
              exit 1
              ;;
          esac
          npm run domains:sync -- --ref "$BITWARDEN_REF"

      - name: Verify custom domains were not touched
        run: git diff --exit-code -- src/static/global_domains.custom.json

      - name: Commit and push synced rules to main
        run: |
          if git diff --quiet -- src/static/global_domains.bitwarden.json src/static/global_domains.bitwarden.meta.json; then
            echo "Nothing to sync — upstream rules unchanged."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/static/global_domains.bitwarden.json src/static/global_domains.bitwarden.meta.json
          git commit -m "chore: sync Bitwarden global domain rules"
          git push origin "HEAD:${GITHUB_REF_NAME}"
