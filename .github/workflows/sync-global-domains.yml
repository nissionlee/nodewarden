name: Sync Bitwarden global domains

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "shuaiplus/nodewarden ref to mirror"
        required: false
        default: "main"
        type: string

# fork 专用说明，改这个文件前先读：
#   1. 本仓库是 shuaiplus/nodewarden 的 fork，GITHUB_TOKEN 在 fork 里无权创建 PR，
#      所以同步结果直接提交到 main，不走 PR。
#   2. 数据源不是上游 bitwarden/server 的 C# 源码，而是**直接镜像上游仓库里已经
#      生成并提交好的那两个 json**。这样 fork 的文件与上游逐字节一致，
#      generatedAt 这类时间戳不会再造成 fork/上游之间的合并冲突。
#   3. 本文件是 fork 相对上游唯一的差异文件，请尽量别引入新的差异。
#   4. 仓库里跑着 actionlint（见 .github/workflows/security-extra.yml），内联脚本会被
#      shellcheck 检查。**别在单引号里出现 $**（SC2016 会让检查变红），
#      JS 一律用 quoted heredoc 落成文件再执行，别用 node -e '...'。
permissions:
  contents: write

env:
  UPSTREAM_REPO: shuaiplus/nodewarden

jobs:
  sync-global-domains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22

      - name: Mirror upstream generated domain rules
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}
        run: |
          set -euo pipefail
          case "$UPSTREAM_REF" in
            "" | *[!A-Za-z0-9._/-]* )
              echo "Invalid upstream_ref"
              exit 1
              ;;
          esac

          base="https://raw.githubusercontent.com/${UPSTREAM_REPO}/${UPSTREAM_REF}/src/static"
          rules="global_domains.bitwarden.json"
          meta="global_domains.bitwarden.meta.json"
          tmp="$(mktemp -d)"
          cleanup() { rm -rf "$tmp"; }
          trap cleanup EXIT

          cat > "$tmp/validate.mjs" <<'JS'
          import { readFileSync } from "node:fs";

          const rules = JSON.parse(readFileSync(process.env.RULES, "utf8"));
          const meta = JSON.parse(readFileSync(process.env.META, "utf8"));

          if (!Array.isArray(rules) || rules.length === 0) {
            throw new Error("rules file is not a non-empty array");
          }
          rules.forEach((rule, i) => {
            if (!Number.isInteger(rule.type) || typeof rule.excluded !== "boolean" || !Array.isArray(rule.domains)) {
              throw new Error("rule #" + i + " has an unexpected shape");
            }
            if (rule.domains.length < 2 || rule.domains.some((d) => typeof d !== "string" || !d)) {
              throw new Error("rule #" + i + " has a bad domain list");
            }
          });

          const domainsCount = rules.reduce((n, rule) => n + rule.domains.length, 0);
          if (meta.rulesCount !== rules.length || meta.domainsCount !== domainsCount) {
            throw new Error(
              "meta counts disagree: meta says " + meta.rulesCount + "/" + meta.domainsCount +
                ", file has " + rules.length + "/" + domainsCount
            );
          }
          if (typeof meta.source !== "string" || !meta.source.includes("bitwarden/server")) {
            throw new Error("unexpected meta.source: " + meta.source);
          }

          console.log("validated " + rules.length + " rules / " + domainsCount + " domains");
          JS

          # 先落到临时目录，校验通过再覆盖 —— 抓取或校验失败时绝不写坏仓库里的文件
          for f in "$rules" "$meta"; do
            curl -fsSL --retry 3 --retry-delay 2 --max-time 60 "$base/$f" -o "$tmp/$f"
          done

          RULES="$tmp/$rules" META="$tmp/$meta" node "$tmp/validate.mjs"

          cp "$tmp/$rules" "src/static/$rules"
          cp "$tmp/$meta" "src/static/$meta"

      - name: Verify custom domains were not touched
        run: git diff --exit-code -- src/static/global_domains.custom.json

      - name: Commit and push mirrored rules to main
        run: |
          set -euo pipefail
          if git diff --quiet -- src/static/global_domains.bitwarden.json src/static/global_domains.bitwarden.meta.json; then
            echo "Nothing to sync — already identical to upstream."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/static/global_domains.bitwarden.json src/static/global_domains.bitwarden.meta.json
          git diff --cached --stat
          git commit -m "chore: sync Bitwarden global domain rules"
          git push origin "HEAD:${GITHUB_REF_NAME}"
